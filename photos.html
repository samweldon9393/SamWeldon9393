<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Photos from Sam Weldon." />
    <title>Photos</title>
    <link rel="stylesheet" href="pub/styles.css" />
    <link rel="icon" href="pub/images/s_vector.png" type="image/png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
            onload="renderMathInElement(document.body);"></script>

    <!-- Registered before Alpine loads (Alpine is deferred). -->
    <script>
      document.addEventListener('alpine:init', () => {
        Alpine.data('imageGallery', () => ({
          opened: false,
          activeUrl: null,
          index: 0,

          // Only <img> tiles open in the lightbox; videos play in place.
          photos() {
            return Array.from(this.$refs.gallery.querySelectorAll('img'));
          },

          openPhoto(event) {
            this.index = this.photos().indexOf(event.target);
            this.activeUrl = event.target.src;
            this.opened = true;
          },

          closePhoto() {
            this.opened = false;
            setTimeout(() => (this.activeUrl = null), 300);
          },

          step(offset) {
            const photos = this.photos();
            this.index = (this.index + offset + photos.length) % photos.length;
            this.activeUrl = photos[this.index].src;
          }
        }));
      });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>

  <body class="relative bg-deepBlue text-white font-Kanit">

    <header role="banner" class="relative flex flex-col items-center justify-between bg-opacity-50 shadow-inner
                                 px-4 pt-8 sm:flex-row md:px-8 sm:py-2 lg:px-10 2xl:py-0">
      <a href="./index.html">
        <h1 class="flex-shrink-0 items-center text-2xl font-serif text-blue-200 hover:rotate-180
                   hover:text-white transition-transform duration-500 opacity-90">
          \[ \overrightarrow{s}W\]
        </h1>
      </a>
      <nav class="sm:ml-auto sm:pt-0 pb-10 text-blue-200">
        <ul class="flex space-x-6 sm:space-x-12 lg:space-x-16 xl:space-x-16 2xl:space-x-20">
          <li class="Card"><a class="Link" href="./about.html">About</a></li>
          <li class="Card"><a class="Link" href="index.html#projects">Projects</a></li>
          <li class="Card"><a class="clickedLink" href="./photos.html">Photos</a></li>
          <li class="Card"><a class="Link" href="index.html#contact">Contact</a></li>
          <li class="Card"><a class="Link" href="pub/Resume.pdf" target="_blank" rel="noopener noreferrer">Resume</a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content" class="mx-auto relative">
      <div class="bg-fixed bg-[length:800px_600px] md:bg-auto bg-no-repeat opacity-75 py-16"
           style="background-image: url(pub/images/sky1.png)">

        <div x-data="imageGallery"
             @keyup.right.window="step(1)"
             @keyup.left.window="step(-1)"
             class="w-full h-full select-none">

          <div class="max-w-6xl mx-auto select-none">
            <ul x-ref="gallery" id="gallery" class="grid grid-cols-2 gap-5 lg:grid-cols-5">
              <li><img x-on:click="openPhoto" src="./pub/images/Seafood.jpg" class="gallery-item" alt="Sanjeev, Chris, Marty, me" /></li>
              <li><img x-on:click="openPhoto" src="./pub/images/Mom.jpg" class="gallery-item" alt="Mom and me" /></li>
              <li><img x-on:click="openPhoto" src="./pub/images/Winnie2.jpg" class="gallery-item" alt="Winnie" /></li>
              <li><img x-on:click="openPhoto" src="./pub/images/Outside.jpg" class="gallery-item" alt="Jake, Paul, me" /></li>
              <li><img x-on:click="openPhoto" src="./pub/images/Headshot.jpg" class="gallery-item" alt="Me" /></li>
              <li><img x-on:click="openPhoto" src="./pub/images/Graduation.jpg" class="gallery-item" alt="Graduation with Corina" /></li>
              <li><img x-on:click="openPhoto" src="./pub/images/Me_Josh_Luci.PNG" class="gallery-item" alt="Friends" /></li>
              <li><img x-on:click="openPhoto" src="./pub/images/Tree.jpeg" class="gallery-item" alt="Christmas tree" /></li>
              <li><img x-on:click="openPhoto" src="./pub/images/Me_Julia_KOR.JPG" class="gallery-item" alt="Julia and me in Korea" /></li>
              <li><video controls src="./pub/images/Video.mov" class="gallery-item"></video></li>
            </ul>
          </div>

          <template x-teleport="body">
            <div x-show="opened"
                 x-transition:enter="transition ease-in-out duration-300"
                 x-transition:enter-start="opacity-0"
                 x-transition:leave="transition ease-in-in duration-300"
                 x-transition:leave-end="opacity-0"
                 @click="closePhoto"
                 @keydown.window.escape="closePhoto"
                 class="fixed inset-0 z-[99] flex items-center justify-center bg-black bg-opacity-50 select-none cursor-zoom-out"
                 x-cloak>
              <div class="relative flex items-center justify-center w-11/12 xl:w-4/5">

                <button type="button" aria-label="Previous photo"
                        @click="$event.stopPropagation(); step(-1)"
                        class="absolute left-0 flex items-center justify-center text-white translate-x-10
                               rounded-full cursor-pointer xl:-translate-x-24 2xl:-translate-x-32
                               bg-white/10 w-14 h-14 hover:bg-white/20">
                  <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                       stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                  </svg>
                </button>

                <img x-show="opened"
                     x-transition:enter="transition ease-in-out duration-300"
                     x-transition:enter-start="opacity-0 transform scale-50"
                     x-transition:leave="transition ease-in-in duration-300"
                     x-transition:leave-end="opacity-0 transform scale-50"
                     class="object-scale-down object-center max-w-xl select-none cursor-zoom-out"
                     :src="activeUrl" alt="" />

                <button type="button" aria-label="Next photo"
                        @click="$event.stopPropagation(); step(1)"
                        class="absolute right-0 flex items-center justify-center text-white -translate-x-10
                               rounded-full cursor-pointer xl:translate-x-24 2xl:translate-x-32
                               bg-white/10 w-14 h-14 hover:bg-white/20">
                  <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                       stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                  </svg>
                </button>

              </div>
            </div>
          </template>

        </div>
      </div>
    </main>

  </body>

</html>
